# This file is a minimal version of the default config file.
# This is NOT supposed to be enough for most servers.
# Please read the fivem documentation:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/

## You SHOULD edit the following:
sv_hostname "Serveur de dév de _mattin_b!"
sets sv_projectName "_mattin_b's server"
sets sv_projectDesc "Serveur de dév de _mattin_b."
sets tags "default, deployer"
sets locale "fr-FR"

setr illenium-appearance:locale "fr"
setr ox:locale "fr"

## These resources will start by default.
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

ensure oxmysql
ensure ox_lib

ensure es_extended
ensure [core]

ensure ox_target
ensure ox_inventory

ensure [identity]

ensure [maps]

ensure [ui]

exec server_private.cfg
exec ox_inventory.cfg